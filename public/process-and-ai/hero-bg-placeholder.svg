<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="presentation" preserveAspectRatio="xMidYMin slice">
  <!--
    Soft atmospheric wash for /process-and-ai hero — warm orange / peach
    blending into lavender at the top, fading cleanly into white.
    No hard circular “ball” shape.
  -->
  <defs>
    <radialGradient id="warm-left" cx="18%" cy="8%" r="55%" fx="18%" fy="8%">
      <stop offset="0" stop-color="#FFB070" stop-opacity=".55" />
      <stop offset=".45" stop-color="#FFC9A0" stop-opacity=".28" />
      <stop offset="1" stop-color="#FFC9A0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warm-center" cx="48%" cy="0%" r="48%" fx="48%" fy="0%">
      <stop offset="0" stop-color="#FFD4A8" stop-opacity=".4" />
      <stop offset="1" stop-color="#FFD4A8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lavender-right" cx="82%" cy="6%" r="52%" fx="82%" fy="6%">
      <stop offset="0" stop-color="#C4B0F0" stop-opacity=".48" />
      <stop offset=".5" stop-color="#D4C4F5" stop-opacity=".22" />
      <stop offset="1" stop-color="#D4C4F5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="64" />
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#FFFFFF" />
  <g filter="url(#soft)">
    <rect width="1440" height="520" fill="url(#warm-left)" />
    <rect width="1440" height="480" fill="url(#warm-center)" />
    <rect width="1440" height="520" fill="url(#lavender-right)" />
  </g>
  <rect width="1440" height="900" fill="url(#fade-down)" />
</svg>
